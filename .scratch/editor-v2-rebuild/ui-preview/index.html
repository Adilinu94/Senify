<body>
<!--
  THESIS: Shell, Editor und Workspaces sind ein Produkt: eine Farbschicht, hell und
  dunkel, ein Akzent mit einer Bedeutung, Höhe aus Fläche und Kante statt Schatten.
  Verweigert: drei getrennte Farbsätze, Limette als Zustand, Schatten als Hierarchie,
  mehrere laute Knöpfe.
  OWN-WORLD: senify.css (--ui-*): neutrale Leiter hell/dunkel, zweite Fläche = Tinte,
  Limette nur als Aussage, 4-px-Takt, Werkzeug eckig / Produkt rund, Inter, Tabulatoren.
  STORY: In Sekunden versteht man Senify — Mensch und Agent auf einem Modell — sieht
  jeden Screen und klickt die Kernflüsse: Editor, Komponente, CMS, Referenz, Review,
  Release, Rollback.
  FIRST VIEWPORT: Start mit 360-px-Navigation (Pille, aktive Zeile in Tinte), Kopfzeile,
  Kennzahlen-Zeile, Fortsetzen-Karte, genau eine gefüllte Handlung „Seite bauen".
  FORM: Bestandssystem erweitert — kein neuer Roll; Struktur aus ui-plan und Designsystem.
  DESIGN.md bleibt design-system/DESIGN-SYSTEM.md (Autorität), alte Schau in styleguide.html.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-label="Meldungen"></div>
<div id="overlays"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="editor.js"></script>
</body>
</html>
