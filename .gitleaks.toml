# gitleaks-Konfiguration (Analyse 06, Kandidat 3).
#
# Der Scan laeuft in der CI als eigener Job (`.github/workflows/verify.yml`).
# Er prueft die Historie, nicht nur den Stand: ein Geheimnis, das einmal
# committet wurde, ist mit einem spaeteren Loeschen nicht aus der Welt.
#
# Jede Ausnahme traegt ihren Grund. Eine Ausnahme ohne Grund ist eine, die
# beim naechsten Umbau niemand mehr nachvollziehen kann - und dann steht sie
# irgendwann im Weg, ohne dass jemand weiss, warum.
#
# Drei Sorten von Ausnahmen, und die unterscheiden sich in ihrer Reichweite:
#
# 1. Absichtliche Beispielschluessel in **getrackten** Dateien. Sie werden
#    gescannt, weil sie getrackt sind - der Test braucht sie, und sie sind
#    keine Zugangsdaten.
# 2. Lokales Arbeitsmaterial, das **nie** committet wird (steht in der
#    .gitignore). Ein Scan des Arbeitsbaums (`--no-git`) stolpert darueber,
#    ein Scan der Historie nie. Sie sind hier genannt, damit ein solcher
#    lokaler Scan nicht wegen Rauschen eingestellt wird.
# 3. Fehlalarme der generischen Regel in **getrackten** Notizen. Sie sind
#    Prosa und Bezeichner, keine Schluessel - nachgewiesen, siehe Grund.
#
# Die Pfadmuster gelten gegen den **absoluten** Pfad, den gitleaks meldet -
# ein Muster mit "^" am Anfang trifft dort nie zu.

title = "Senify"

[extend]
useDefault = true

# 1. Absichtliche Beispielschluessel in getrackten Dateien.
[[allowlists]]
description = "Testdaten: Idempotency-Keys im Redesign-Test und der SMTP-Testschluessel"
paths = [
  '''packages/engine/test/redesign-proposals\.test\.ts''',
  '''packages/engine/test/fixtures/smtp/.*''',
]

# 2. Lokales Arbeitsmaterial, das nie committet wird (siehe .gitignore).
[[allowlists]]
description = "Lokales Referenzmaterial des Autors unter .scratch/refs/nick/ (Messungen und Skripte). Enthaelt Vorschau-Token des LOKALEN Programms, keine Zugangsdaten eines fremden Dienstes; der Pfad steht seit 13.10.2026 in der .gitignore und ist nie committet."
paths = [
  '''\.scratch/refs/nick/''',
]

# 3. Fehlalarme der generischen Regel in getrackten Notizen des Autors.
[[allowlists]]
description = "Zwei Fehlalarme der 'generic-api-key'-Regel in getrackten Notizen: die Fundstellen sind Prosa und ein Bezeichner ('resolveVercelToken, ...' in ledger.md Zeile 1127, 'Tokens, ...' in der Framer-Analyse Zeile 4), keine Schluessel. Der Historien-Scan - der CI-Job - meldet diese Dateien auch ohne die Ausnahme nicht; sie gilt dem Arbeitsbaum-Scan."
paths = [
  '''\.scratch/editor-v2-rebuild/ledger\.md''',
  '''\.scratch/senify-v1/research/''',
]

[[allowlists]]
description = "Ungetrackte Bau- und Analyseartefakte (.gitignore): entstehen bei jedem Lauf und werden nie committet."
paths = [
  '''/\.tmp/''',
  '''/\.bake-tmp/''',
  '''/graphify-out/''',
  '''/packages/renderer/\.bake/''',
]
