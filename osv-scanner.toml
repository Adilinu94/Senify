# Ausnahmen des OSV-Scans (Analyse 06, Kandidat 4).
#
# Der Scanner meldet jede bekannte Schwachstelle in der Aufloesung - auch
# transitive, die im Modulbaum gar nicht landen. Ohne Ausnahmeliste wird der
# Schritt nach einem Monat ignoriert, und ein ignorierter Schritt ist schlimmer
# als ein fehlender.
#
# Jede Ausnahme nennt ihren Grund und ein Datum: `ignoreUntil` laesst die
# Ausnahme ablaufen, dann meldet der Scanner den Fund wieder. Eine Ausnahme
# ohne Ablaufdatum ist eine Ausnahme auf unbestimmte Zeit.
#
# Die Datei heisst `osv-scanner.toml` (ohne Punkt) und liegt im Ordner, der
# gescannt wird - der Scanner sucht sie neben dem Lockfile.
#
# **Stand 24.10.2026: die Ausnahmeliste ist leer.** Kein Eintrag, kein
# Ablaufdatum, nichts zu verlängern. Der Grund steht unten bei den einzelnen
# Nachträgen; die vier Vitest-Ausnahmen sind entfallen, weil der Runner auf
# 4.1.12 steht und die Advisories damit gegenstandslos sind.
#
# Ein leeres Blatt mit Begruendung ist ehrlicher als eine geloeschte Datei: der
# Scanner liest sie, und der naechste Audit findet die Historie statt einer
# Luecke.
#
# 22.10.2026: Alle fuenf damaligen Ausnahmen sind entfallen, jede aus einem
# eigenen Grund:
#
# - Die drei Vitest-Ausnahmen (GHSA-82fw-gwwq-j7x9 fuer vitest,
#   GHSA-qxg6-89mg-rqv8 fuer @vitest/mocker, GHSA-5gmw-xhrv-c9v3 und
#   GHSA-85c8-ppgw-ccpr fuer tinypool) begruendeten sich mit "der Sprung auf
#   vitest 4.x ist ein Major-Update und braucht einen eigenen Schritt". Dieser
#   Schritt ist getan: der Test-Runner steht auf 4.1.12. Der Scan meldet
#   "No issues found", ohne eine einzige Ausnahme.
# - `http-cache-semantics` (GHSA-ch52-4w7c-c8xp) war an 4.2.0 gebunden. Es
#   gibt 4.3.0, und die Advisory gilt laut OSV nur bis einschliesslich 4.2.0.
#   Die Begruendung der alten Ausnahme war zudem sachlich falsch: sie nannte
#   express und dessen statischen Dateihandler als Quelle. Im Lockfile kommt
#   die Abhaengigkeit ueber `astro` (der Build des Docs-Portals) - express
#   5.2.1 und `serve-static` 2.2.1 ziehen sie nicht mehr. Der Befund betraf
#   also den Doku-Build und nicht den Dashboard-Proxy; die gemeldete
#   Cache-Poisoning-Route war dort ohnehin nicht erreichbar. Beides ist
#   gegenstandslos, weil die betroffene Version nicht mehr im Baum ist.
#
# Nachtrag 22.10.2026 (abends): zwei an diesem Tag veroeffentlichte
# Advisories sind ebenfalls ohne Ausnahme geschlossen. `astro`
# (GHSA-mpr7-6m5w-76rw, CSS-Injection in View Transitions, behoben in 7.3.3)
# steht jetzt auf ^7.3.3 in `packages/renderer` und `packages/docs-portal`;
# `ip-address` (GHSA-rxp7-6hxx-x8q5, quadratische Laufzeit vor der
# Laengenpruefung, behoben in 10.7.4) kommt ueber `express-rate-limit` und
# steht als Override auf 10.7.4. Beide hatten ein Fix-Release, also war eine
# Ausnahme nicht noetig - der Scan blieb gruen, ohne dass etwas eingetragen
# wurde.
#
# Nachtrag 24.10.2026 (mittags, unabhaengig auf zwei Staenden entstanden):
# vier Advisories an einem Tag, alle vier ohne Ausnahme ueber einen Override
# geschlossen. Sie kamen nicht durch eine Aenderung am Code, sondern durch neue
# Meldungen in der OSV-Datenbank:
#
# - `body-parser` (GHSA-27r3-jxmh-p828, 7,5, ungueltige Anfrage legt den
#   Prozess lahm; behoben in 2.4.0) kommt ueber `express` 5.2.1, das
#   `@modelcontextprotocol/sdk` als Abhaengigkeit zieht. 2.3.0 -> 2.4.0 ist
#   ein Patch-Sprung.
# - `fast-uri` (vier Advisories, 3,7 bis 6,1, Host-Verwechslung und
#   Pfad-Ausbruch; behoben in 3.1.9) kommt ueber `ajv` 8.20.0 -> auch von
#   `@modelcontextprotocol/sdk`. 3.1.8 -> 3.1.9 ist ein Patch.
# - `happy-dom` (GHSA-834v-8h66-3h79, 8,8, Code-Ausfuehrung; behoben in
#   21.0.4) ist ein OPTIONALER Peer von `vitest` mit dem Bereich `*`. Das
#   Projekt setzt `environment: "node"` und benutzt happy-dom nirgends; die
#   Hauptversion 21 ist deshalb gefahrlos, und der Override laesst das Paket
#   ganz aus dem Baum fallen (es wird nicht mehr installiert).
# - `undici` (drei Advisories, 5,9 bis 7,5, Request-Smuggling und
#   Header-Injection; behoben in 8.12.2) kommt ueber `unifont` aus dem
#   Astro-Doku-Build. 8.10.2 -> 8.12.2 ist ein Patch.
#
# Alle vier waren vorher schon im Baum, nur nicht gemeldet: der Scan fragt die
# OSV-Datenbank bei jedem Lauf neu, und die Meldungen entstanden zwischen dem
# letzten gruenen Lauf (23.10.) und diesem. Keine Ausnahme, kein Ablaufdatum -
# die Fixes sind da.
#
# Nachtrag 24.10.2026 (nachmittags, Richtigstellung aus dem parallelen Strang):
# Die vier Vitest-Ausnahmen standen hier bis eben noch als Eintraege, obwohl
# ihre Begruendung sie selbst aufhob ("der Sprung auf vitest 4.x braucht einen
# eigenen Schritt" - dieser Schritt ist getan, der Runner steht auf 4.1.12).
# Eine Ausnahme, die nichts mehr ausnimmt, ist eine Behauptung ohne Deckung:
# der Scanner meldet sie als unbenutzt, und beim naechsten Audit fragt jemand,
# warum sie noch da ist. Sie sind entfernt, nicht verlaengert.
#
# Die vier Eintraege trugen `ignoreUntil = 2026-11-30`, also ein Datum in der
# Zukunft. Das ist der unangenehme Fall: sie waeren nicht von selbst
# abgelaufen, sondern haetten den Scan bis Ende November stillgehalten - auch
# fuer eine NEUE Advisory auf demselben Paket. Genau davor warnt der Kopf
# dieser Datei.
#
# ---------------------------------------------------------------------------
# Nachtrag 16.11.2026: neue Meldungen der OSV-Datenbank auf unveraendertem
# Stand. `origin/master` traegt dieselben Versionen (hono 4.13.11, astro
# 7.4.2, basic-ftp 5.3.1, extract-zip 2.0.1, minimatch 10.2.6, zod 3.25.76);
# die Funde entstanden also zwischen dem letzten gruenen Lauf (27.10.2026) und
# dem 16.11.2026, nicht durch eine Aenderung an diesem Branch.
#
# Drei Patch-Fixes sind als Override eingetragen (package.json):
# `hono` 4.13.16, `@hono/node-server` 2.1.6, `astro` 7.4.7.
#
# Vier Pakete brauchen einen eigenen Schritt und stehen deshalb hier, jedes mit
# Grund und Ablaufdatum (15.12.2026, dann meldet der Scanner sie wieder):
#
# - `basic-ftp` 5.3.1: Fix ist 6.2.4, ein Hauptversionssprung. Der Client
#   haengt am Browser-Werkzeug (Playwright-Download); ein Major-Override
#   braucht einen eigenen Testlauf.
# - `minimatch` 10.2.6: Fix ist 11.0.1, ebenfalls ein Hauptversionssprung;
#   die Kette laeuft ueber den Astro-Build.
# - `zod` 3.25.76: Fix ist 4.6.6, ein Hauptversionssprung der Schema-API; die
#   MCP-SDK-Aufrufer sind auf zod 3 geschrieben.
# - `extract-zip` 2.0.1: der Scanner nennt keinen Fix.

