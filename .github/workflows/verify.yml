name: verify

# Das Gate des Repos (Ticket 17 Punkt 5, Luecke L4): Build, Lint und die
# Testsuite laufen als blockierender Schritt, danach das Paritaets-Tor mit
# Pflicht-Browser (SENIFY_REQUIRE_BROWSER=1, siehe scripts/verify-parity.mjs).
# Ohne installierten Chromium wird das Tor rot statt still uebersprungen.
#
# Zwei weitere Jobs fuehren die Nachweise, die der erste Job nicht erbringen
# kann: `postgres-tests` die Transaktionsbeweise gegen eine ECHTE Postgres und
# `coverage` das Schwellen-Tor ueber den teuersten Pfaden (Fahrplan P1-1 und
# P1-2, R11). Beide sind absichtlich eigene Jobs und keine weiteren Schritte im
# ersten: sie sollen als eigener gruener oder roter Balken sichtbar sein, nicht
# als Zeile im Rollout eines anderen Jobs.
on:
  # Minuten sparen (07.10.2026): kein Lauf pro Push auf beliebige Branches -
  # das Gate zaehlt auf dem Pull Request, wo es vor dem Merge entscheidet.
  # Ausnahme (16.10.2026): Pushes auf master laufen mit, damit ein roter
  # master (Direkt-Push oder Merge-Stand) nicht unbemerkt bleibt. Wer einen
  # anderen Stand ohne PR pruefen will, startet den Workflow von Hand
  # (`workflow_dispatch`).
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Der Workflow liest nur; er braucht kein Schreibrecht auf das Repo.
permissions:
  contents: read

# Ein neuer Push auf denselben PR bricht den veralteten Lauf ab (die Jobs
# sind teuer: Browser, echte Postgres).
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Die Actions sind auf Commits gepinnt (der Kommentar nennt das Tag): ein
# verschobenes Tag kann keinen fremden Code in den Lauf bringen. Aktualisieren
# per Dependabot (`package-ecosystem: github-actions`) oder von Hand.
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Pflicht-Browser: ohne diese Variable ueberspringen sich die
    # Browser-Suiten still, wenn Chromium fehlt oder nicht zur Playwright-
    # Version passt. Ein gruener Lauf, in dem die Browser-Tore nie
    # gelaufen sind, ist kein Nachweis - der Job soll an der fehlenden
    # Version rot werden, nicht gruen ohne Test.
    #
    # Der Windows-Job setzt sie bewusst NICHT: dort ist kein Chromium
    # installiert, und die Browser-Suiten laufen im Linux-Job.
    env:
      SENIFY_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Kein `version:` hier: pnpm/action-setup liest die Version aus
      # `packageManager` in der package.json. Gibt man beides an, bricht die
      # Aktion mit "Multiple versions of pnpm specified" ab, bevor ein Job
      # richtig startet (so am 01.10.2026 gesehen).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser fuer die Paritaets-Messung
        run: pnpm exec playwright install --with-deps chromium
      - name: Gate (Build, Lint, Tests)
        run: pnpm verify
      # Die Paketregeln (ADR-0019, P3-3) als eigener Schritt: sie sind ein
      # eigener Nachweis mit eigenem Balken, und sie laufen auch dann, wenn
      # jemand den `verify`-Schritt veraendert.
      - name: Paketregeln (keine verbotene Kante, kein neuer Zyklus)
        run: pnpm deps:check
      # Das Manifest darf nicht veralten: die Datei ist generiert, und eine
      # generierte Datei ohne Tor driftet still.
      - name: Manifest entspricht dem Generator
        run: pnpm manifest:check
      # Dasselbe gilt fuer die Route-Matrix: sie wird aus den Routen der
      # Engine und dem Manifest erzeugt. Ohne Tor zeigt sie den Stand eines
      # Moduls, das es nicht mehr gibt.
      - name: Routen-Matrix entspricht dem Generator
        run: pnpm route-matrix:check
      # Der Artefakt-Nachweis (Fahrplan P0-4 Punkt 3, R1) laeuft als eigener
      # Schritt, damit im Log sichtbar bleibt, dass `pnpm build` wirklich eine
      # auslieferbare Shell erzeugt hat - nicht nur, dass der Arbeitsbaum
      # typisiert. `verify` ruft dasselbe Skript bereits auf; der eigene Schritt
      # macht es als Balken lesbar, falls jemand die Kette veraendert.
      - name: Artefakt-Tor (packages/app/dist)
        run: pnpm verify:dist
      # Fahrplan P3-6: der Docs-Portal-Build steckt im rekursiven `pnpm build`
      # von `pnpm verify`. Der eigene Schritt macht ihn als Balken sichtbar
      # (Astro-Build plus Pagefind-Index, rund 4 Sekunden).
      - name: Docs-Portal-Build (Astro und Suchindex)
        run: pnpm --filter @senify/docs-portal build
      - name: Visuelles PNG-Gate (Settings, Referenzen, Editor)
        run: pnpm test:visual
      - name: Visuelle Diff-Artefakte
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diffs
          path: .scratch/editor-v2-rebuild/visual-diffs
          if-no-files-found: ignore
      - name: Paritaets-Tor (Canvas vs. Release)
        run: pnpm verify:parity
      - name: Import-Tor (Original vs. Senify)
        run: pnpm verify:import

  # Entwickelt und betrieben wird unter Windows (start-senify.cmd, Pfade,
  # Dateirechte, der Start-Eintrag). Dieser Job faehrt die Testsuite dort.
  # Er war bewusst nicht blockierend (continue-on-error), bis er einmal gruen
  # gelaufen ist; das ist am 04.10.2026 mehrfach geschehen (Push- und
  # Pull-Request-Laeufe der Staende 953d114, 6c35e3e und 0386cf9), die Zeile ist
  # entfernt und der Job damit ein Tor. Faellt er kuenftig rot aus, ist das ein
  # echter Befund. Ohne installierten Chromium ueberspringen die Browser-Suiten
  # sich selbst.
  tests-windows:
    name: Testsuite unter Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testsuite
        # Das Repo liegt auf D:, das Standard-Temp auf C:. Das war einmal ein
        # Problem: Astro verschob die gebauten Dateien per rename() aus dem
        # Stage-Ordner (im Repo) in den Zielordner (im Temp), und ein rename()
        # ueber Laufwerke hinweg scheitert mit EXDEV. Das ist jetzt im Code
        # geloest (packages/renderer/src/bake.ts: der Bake baut neben der
        # Stage und kopiert das Ergebnis), nicht mehr im Runner.
        run: pnpm test

  # Geheimnis-Scan (Analyse 06, Kandidat 3). Der Job ist absichtlich eigens:
  # ein versehentlich committeter Operator-Token waere ein Vollzugriff auf das
  # lokale Programm, und das ist eine andere Frage als " baut der Code".
  #
  # gitleaks laeuft als Binary, nicht als Action: die Action verlangt ab v2
  # eine Lizenz fuer Organisationen, und das Repo soll ohne Geheimnis-Key
  # laufen. Die Version ist gepinnt und die Pruefsumme wird verglichen.
  #
  # `fetch-depth: 0` ist noetig: der Scan geht die Historie durch, und ein
  # flacher Checkout sieht nur den letzten Commit.
  secrets:
    name: Geheimnis-Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks holen und Pruefsumme vergleichen
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfL "$base/gitleaks_${version}_linux_x64.tar.gz" -o "gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${version}_checksums.txt" -o checksums.txt
          # Die Pruefsummendatei nennt den Originalnamen - der Abgleich
          # funktioniert nur, wenn die Datei unter diesem Namen liegt.
          grep "gitleaks_${version}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Suche nach Geheimnissen
        # Die Ausnahmen stehen in .gitleaks.toml und tragen je einen Grund.
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

  # Abhaengigkeits-Scan (Analyse 06, Kandidat 4). OSV-Scanner liest das
  # Lockfile und fragt die OSV-Datenbank ab - die Datenbasis, die auch
  # transitive Pakete kennt, die im Modulbaum gar nicht landen.
  #
  # Das Binary kommt aus dem Release mit fester Version, und die Pruefsumme
  # wird verglichen - wie beim gitleaks-Schritt. Der Weg ueber den
  # revidierbaren Workflow von Google ist nicht gangbar: er brachte den
  # ganzen Lauf in einen "startup_failure", und der eigene Job braucht
  # ausserdem keine Berechtigungen fuer fremde Workflows.
  #
  # Die Ausnahmen stehen in osv-scanner.toml und tragen je einen Grund und ein
  # Ablaufdatum: laeuft die Ausnahme ab, meldet der Scanner den Fund wieder.
  dependencies:
    name: Bekannte Schwachstellen in den Abhaengigkeiten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: osv-scanner holen und Pruefsumme vergleichen
        run: |
          set -euo pipefail
          version=2.7.0
          base="https://github.com/google/osv-scanner/releases/download/v${version}"
          curl -sSfL "$base/osv-scanner_linux_amd64" -o osv-scanner_linux_amd64
          curl -sSfL "$base/osv-scanner_SHA256SUMS" -o SHA256SUMS
          # Die Pruefsummendatei nennt den Originalnamen - der Abgleich
          # funktioniert nur, wenn die Datei unter diesem Namen liegt.
          grep "osv-scanner_linux_amd64" SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64
          sudo install -m 0755 osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
      - name: Bekannte Schwachstellen suchen
        # Der Scanner liest die Ausnahmen aus osv-scanner.toml neben dem
        # Lockfile und beendet sich mit 1, wenn er etwas findet, das nicht
        # ausgenommen ist.
        run: osv-scanner --recursive --lockfile pnpm-lock.yaml

  postgres-tests:
    name: Transaktionsbeweise gegen echte Postgres
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: senify
          POSTGRES_PASSWORD: senify
          POSTGRES_DB: senify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U senify -d senify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://senify:senify@localhost:5432/senify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Das Schema muss kein Schritt vorher anlegen: packages/engine/test/helpers.ts
      # baut pro Lauf ein eigenes, veraenderliches Schema auf (ensureSchema) und
      # haengt es beim Schliessen wieder ab. Ein kaputter Aufbau loescht sein
      # Schema selbst, damit die Lane keine halben Tabellen hinterlaesst.
      # Die Lane selbst ist rot, wenn auch nur ein Fall uebersprungen wird.
      - name: 'Lane (Pflicht: 0 uebersprungen)'
        run: pnpm test:postgres

  coverage:
    name: Coverage-Tor der geschuetzten Pfade
    runs-on: ubuntu-24.04
    # Vitest 4 ersetzt die alten VITEST_MAX_FORKS/MAX_THREADS-Variablen durch
    # VITEST_MAX_WORKERS. Zwei Worker begrenzen die Last des Coverage-Laufs;
    # die alte Variable wuerde unter v4 still ignoriert.
    env:
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Die Schwellen liegen in vitest.config.ts und gelten pro Datei. Der Job
      # faehrt nur die Suites der geschuetzten Pfade, nicht die schweren
      # Browser-Suiten - damit das Tor von der Sache redet und nicht von der
      # Playwright-Last des Laufers.
      - name: Tor (pro Datei, keine Durchschnittsrettung)
        run: pnpm test:coverage
      # P3-6: the measured block in `docs/current/qualitaet.md` must be what
      # THIS run measured. `--check` does not write - it compares and fails, so
      # the run that disagrees with the document goes red instead of quietly
      # rewriting the evidence. A human decides which of the two is right.
      - name: Messwerte im Doku-Stand?
        run: pnpm quality:check
      - name: Zusammenfassung als Artefakt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
